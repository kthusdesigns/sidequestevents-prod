# Replace the "backend" object below with the snippet from DecapBridge. We need something here to get the CMS to work locally, but this alone won't work in production
backend:
  name: git-gateway
  repo: kthusdesigns/ucan-prod
  branch: main
  identity_url: https://auth.decapbridge.com/sites/500e61dd-27a9-4e9b-8cbd-21a40cef870a
  gateway_url: https://gateway.decapbridge.com

# See who did what (optional)
commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://res.cloudinary.com/dxave0gy0/image/upload/v1777485308/UCAN_Logo_Admin_dhufpi.svg

# Add site links in Decap CMS (optional)
site_url: https://ucanmetrodenver.org

# Keep this to allow you to edit the cms locally
local_backend: true

# Image folders
media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"

# Decap CMS Collections
collections:
    - name: "news"
      label: "Post"
      folder: "src/content/blog"
      create: true
      slug: "{{slug}}-{{year}}-{{month}}-{{day}}"
      summary: "{{date | date('YYYY-MM-DD')}} | {{title}}"
      view_filters:
        - label: "Posts"
          field: tags
          pattern: post
      fields:
          - { # Featured Image
                label: "Featured Image (required)",
                name: "image",
                widget: "image",
                required: true,
                media_folder: "/src/assets/images/blog",
                public_folder: "/assets/images/blog",
                default: "/assets/images/blog/blog-placeholder-image.png"
            }
          - { # Post Title
                label: "Post Title",
                name: "title",
                widget: "string",
                required: true,
                hint: "Input the title of this news post."
            }
          - { # Post Excerpt
                label: "Post Excerpt",
                name: "excerpt",
                widget: "text",
                required: false,
                hint: "Write a short summary (1-2 sentences) that will appear on the blog listing page."
            }
          - { # Date
                label: "Post Date",
                name: "date",
                widget: "date",
                required: true,
                hint: "The selected date does not need to reflect actual date that you publish your post."
            }
          - { # Tags (hidden — auto-set to "post")
                label: "Tags",
                name: "tags",
                widget: "hidden",
                default: ["post"]
            }
          - { # Blog Post Content/Body
                label: "Post Content",
                name: "body",
                widget: "markdown",
                required: true,
                default: "<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
                <p>Quisque faucibus ex sapien vitae pellentesque sem placerat. In id cursus mi pretium tellus duis convallis. Tempus leo eu aenean sed diam urna tempor. Pulvinar vivamus fringilla lacus nec metus bibendum egestas.</p>",
                hint: "Replace the placeholder text with your content."
            }

    - name: "events"
      label: "Event"
      folder: "src/content/events"
      create: true
      slug: "{{slug}}-{{year}}-{{month}}-{{day}}"
      summary: "{{date | date('YYYY-MM-DD')}} | {{title}}"
      view_filters:
        - label: "Events"
          field: tags
          pattern: event
      fields:
          - { # Featured Image
                label: "Featured Image (required)",
                name: "image",
                widget: "image",
                required: true,
                media_folder: "/src/assets/images/blog",
                public_folder: "/assets/images/blog",
                default: "/assets/images/blog/blog-placeholder-image.png"
            }
          - { # Event Title
                label: "Event Title (required)",
                name: "title",
                widget: "string",
                required: true,
                hint: "Input the title of this event."
            }
          - { # Event Excerpt
                label: "Event Excerpt",
                name: "excerpt",
                widget: "text",
                required: true,
                hint: "Write a short summary (1-2 sentences) that will appear on the events listing page."
            }
          - { # Event Date
                label: "Event Date (required)",
                name: "date",
                widget: "date",
                required: true,
                hint: "The date the event takes place. Events are automatically hidden from the feed after this date."
            }
          - { # Time Range
                label: "Event Time (required)",
                name: "timeRange",
                widget: "string",
                required: true,
                hint: "e.g. 11 AM - 12 PM"
            }
          - { # Location
                label: "Location / Venue Name",
                name: "location",
                widget: "string",
                required: false,
                hint: "e.g. Denver Community Center"
            }
          - { # Address
                label: "Event Address (required)",
                name: "address",
                widget: "string",
                required: true,
                hint: "e.g. 123 Main St, Denver, CO 80203"
            }
          - { # Eventbrite URL
                label: "Eventbrite Registration Link",
                name: "eventbriteUrl",
                widget: "string",
                required: false,
                hint: "Paste the full Eventbrite event URL. A 'Register on Eventbrite' button will appear on the event page if this is filled in."
            }
          - { # Tags (hidden — auto-set to "event")
                label: "Tags",
                name: "tags",
                widget: "hidden",
                default: ["event"]
            }
          - { # Event Content/Body
                label: "Event Content (required)",
                name: "body",
                widget: "markdown",
                required: true,
                default: "<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>",
                hint: "Replace the placeholder text with your content."
            }
