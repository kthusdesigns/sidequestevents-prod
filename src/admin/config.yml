# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: kthusdesigns/sidequestevents-prod
  branch: main
  identity_url: https://auth.decapbridge.com/sites/b7ea7adf-66f8-4964-96b3-0940e6d63960
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://res.cloudinary.com/dxave0gy0/image/upload/v1779471546/CMS_Identity__Portal_Logo_mkvebi.png

# Add site links in Decap CMS (optional)
site_url: https://sidequesteventsco-prod.netlify.app

# Keep this to allow you to edit the cms locally
local_backend: true

# Image folders
media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"

# Decap CMS Collections
collections:
    - name: "events"
      label: "Event"
      folder: "src/content/events"
      create: true
      slug: "{{slug}}-{{fields.city | lower}}-{{fields.state | lower}}-{{year}}-{{month}}-{{day}}"
      summary: "{{date | date('YYYY-MM-DD')}} | {{title}}"
      view_filters:
        - label: "Events"
          field: tags
          pattern: event
      fields:
          - { # Featured Image
                label: "Featured Image (required)",
                name: "image",
                widget: "image",
                required: true,
                media_folder: "/src/assets/images/blog",
                public_folder: "/assets/images/blog",
                default: "/assets/images/blog/blog-placeholder-image.png"
            }
          - { # Event Type
                label: "Event Type (required)",
                name: "type",
                widget: "string",
                required: true,
                hint: "Input the event type (e.g., 'Networking', 'Class', or 'Market', etc.)."
            }
          - { # Event Title
                label: "Event Title (required)",
                name: "title",
                widget: "string",
                required: true,
                hint: "Input the title of this event."
            }
          - { # Event Excerpt
                label: "Event Excerpt",
                name: "excerpt",
                widget: "text",
                required: true,
                hint: "Write a short summary (1-2 sentences) that will be used as the webpage's meta description. You can copy and paste the first few sentences from the blog post's content so long as it completes a thought."
            }
          - { # Event Date
                label: "Event Date (required)",
                name: "date",
                widget: "date",
                required: true,
                hint: "The date the event takes place. Events are automatically hidden from the feed after this date at 11:59 PM."
            }
          - { # Start Time
                label: "Start Time (required)",
                name: "startTime",
                widget: "datetime",
                date_format: false,
                time_format: "h:mm A",
                required: true,
                hint: "e.g. 10:00 (10 AM)"
            }
          - { # End Time
                label: "End Time (required)",
                name: "endTime",
                widget: "datetime",
                date_format: false,
                time_format: "h:mm A",
                required: true,
                hint: "e.g. 14:00 (2 PM)"
            }
          - { # Location
                label: "Venue Name",
                name: "location",
                widget: "string",
                required: false,
                hint: "e.g. Denver Community Center"
            }
          - { # Street Address
                label: "Street Address (required)",
                name: "streetAddress",
                widget: "string",
                required: true,
                hint: "e.g. 4850 National Western Drive, Ste 100"
            }
          - { # City
                label: "City (required)",
                name: "city",
                widget: "string",
                required: true,
                hint: "e.g. Highlands Ranch"
            }
          - # State
            label: "State (required)"
            name: "state"
            widget: "select"
            required: true
            default: "CO"
            options:
              - { label: "Alabama", value: "AL" }
              - { label: "Alaska", value: "AK" }
              - { label: "Arizona", value: "AZ" }
              - { label: "Arkansas", value: "AR" }
              - { label: "California", value: "CA" }
              - { label: "Colorado", value: "CO" }
              - { label: "Connecticut", value: "CT" }
              - { label: "Delaware", value: "DE" }
              - { label: "District of Columbia", value: "DC" }
              - { label: "Florida", value: "FL" }
              - { label: "Georgia", value: "GA" }
              - { label: "Hawaii", value: "HI" }
              - { label: "Idaho", value: "ID" }
              - { label: "Illinois", value: "IL" }
              - { label: "Indiana", value: "IN" }
              - { label: "Iowa", value: "IA" }
              - { label: "Kansas", value: "KS" }
              - { label: "Kentucky", value: "KY" }
              - { label: "Louisiana", value: "LA" }
              - { label: "Maine", value: "ME" }
              - { label: "Maryland", value: "MD" }
              - { label: "Massachusetts", value: "MA" }
              - { label: "Michigan", value: "MI" }
              - { label: "Minnesota", value: "MN" }
              - { label: "Mississippi", value: "MS" }
              - { label: "Missouri", value: "MO" }
              - { label: "Montana", value: "MT" }
              - { label: "Nebraska", value: "NE" }
              - { label: "Nevada", value: "NV" }
              - { label: "New Hampshire", value: "NH" }
              - { label: "New Jersey", value: "NJ" }
              - { label: "New Mexico", value: "NM" }
              - { label: "New York", value: "NY" }
              - { label: "North Carolina", value: "NC" }
              - { label: "North Dakota", value: "ND" }
              - { label: "Ohio", value: "OH" }
              - { label: "Oklahoma", value: "OK" }
              - { label: "Oregon", value: "OR" }
              - { label: "Pennsylvania", value: "PA" }
              - { label: "Rhode Island", value: "RI" }
              - { label: "South Carolina", value: "SC" }
              - { label: "South Dakota", value: "SD" }
              - { label: "Tennessee", value: "TN" }
              - { label: "Texas", value: "TX" }
              - { label: "Utah", value: "UT" }
              - { label: "Vermont", value: "VT" }
              - { label: "Virginia", value: "VA" }
              - { label: "Washington", value: "WA" }
              - { label: "West Virginia", value: "WV" }
              - { label: "Wisconsin", value: "WI" }
              - { label: "Wyoming", value: "WY" }
          - { # ZIP Code
                label: "ZIP Code (required)",
                name: "zip",
                widget: "string",
                required: true,
                hint: "e.g. 80112"
            }
          - { # Eventbrite URL
                label: "Eventbrite Registration Link",
                name: "eventExtUrl",
                widget: "string",
                required: false,
                hint: "Paste the full Eventbrite event URL. A 'Register on Eventbrite' button will appear on the event page if this is filled in."
            }
          - { # Tags (hidden — auto-set to "event")
                label: "Tags",
                name: "tags",
                widget: "hidden",
                default: ["event"]
            }
          - # Event Content/Body
            label: "Event Content (required)"
            name: "body"
            widget: "markdown"
            required: true
            buttons:
              - bold
              - italic
              - link
              - heading-one
              - heading-two
              - heading-three
              - heading-four
              - heading-five
              - heading-six
              - bulleted-list
              - numbered-list
            editor_components: ["image"]
            default: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat."
            hint: "Replace the placeholder text with your content."
          - { # Google Form Embed
                label: "Google Form Embed for Vendors",
                name: "googleFormEmbed",
                widget: "code",
                required: false,
                default_language: "html",
                allow_language_selection: false,
                output_code_only: true,
                hint: "Paste the full iframe embed code from Google Forms (click Send > Embed HTML)."
            }

    - name: "privateEventPackages"
      label: "Private Event Packages"
      label_singular: "Package"
      folder: "src/content/private-event-packages"
      create: true
      slug: "{{slug}}"
      summary: "{{title}}"
      fields:
          - { # Featured Image
                label: "Featured Image (required)",
                name: "image",
                widget: "image",
                required: true,
                media_folder: "/src/assets/images/private-event-packages",
                public_folder: "/assets/images/private-event-packages",
                default: "/assets/images/private-event-packages/blog-placeholder-image.png"
            }
          - { # Package Type
                label: "Package Type (required)",
                name: "type",
                widget: "string",
                required: true,
                hint: "Input the event type (e.g., 'Fundraiser', 'Class', or 'Private Tour', etc.)."
            }
          - { # Package Title
                label: "Package Title (required)",
                name: "title",
                widget: "string",
                required: true,
                hint: "Input the name of this private party package, e.g. 'Coffee, Books & Thrift Bus Tour'."
            }
          - { # Package Excerpt
                label: "Package Excerpt (required)",
                name: "excerpt",
                widget: "text",
                required: true,
                hint: "Write a short summary (1-2 sentences) that will be used on the Private Parties page and as this page's meta description."
            }
          - { # Best For
                label: "Best For",
                name: "bestFor",
                widget: "string",
                required: false,
                hint: "Who is this package best suited for? e.g. 'Bachelorette Parties, Birthdays, Girls' Night Out'"
            }
          - # Guest Capacity Range
            label: "Guest Capacity Range (required)"
            name: "guestCapacity"
            widget: "select"
            required: true
            default: "11-20 Guests"
            options:
              - { label: "Up to 10 Guests", value: "Up to 10 Guests" }
              - { label: "11-20 Guests", value: "11-20 Guests" }
              - { label: "21-30 Guests", value: "21-30 Guests" }
              - { label: "31-40 Guests", value: "31-40 Guests" }
              - { label: "41-50 Guests", value: "41-50 Guests" }
              - { label: "50+ Guests", value: "50+ Guests" }
          - { # Typical Duration
                label: "Typical Duration in Hours (required)",
                name: "duration",
                widget: "number",
                value_type: "int",
                required: true,
                min: 1,
                hint: "Enter the typical length of this package in hours, e.g. enter '3' for a 3-hour experience."
            }
          - { # Starting Price
                label: "Starting Price",
                name: "startingPrice",
                widget: "string",
                required: false,
                hint: "e.g. 'Starting at $250'. If you do not fill out this field, it will default to 'Custom Quote'."
            }
          - { # Tags (hidden — auto-set to "privateEventPackage")
                label: "Tags",
                name: "tags",
                widget: "hidden",
                default: ["privateEventPackage"]
            }
          - # Package Details/Body
            label: "Package Details (required)"
            name: "body"
            widget: "markdown"
            required: true
            buttons:
              - bold
              - italic
              - link
              - heading-one
              - heading-two
              - heading-three
              - heading-four
              - heading-five
              - heading-six
              - bulleted-list
              - numbered-list
            editor_components: ["image"]
            default: |
              This is all placeholder text. Replace everything with the info you would like to include.

              ## What's Included

              - Private use of the venue/space for the duration of your event
              - A dedicated SideQuest Events host to coordinate the experience
              - All activity stations, games, or equipment listed for this package

              ## A Typical Itinerary

              - Arrival & welcome - guests check in and settle into the space
              - Main activity - the core experience for this package
              - Wrap-up - final games, group photo, and farewells

              ## Good to Know

              Replace this text with anything guests should plan for, such as parking, what to bring, age recommendations, or dietary accommodations.
            hint: "Replace the placeholder text with your content to describe what's included in this package—itinerary, is it indoors or outdoors, available add-ons, etc."

    - name: "marquee"
      label: "Marquee Photos"
      label_singular: "Marquee Photo"
      folder: "src/content/marquee"
      create: true
      slug: "{{slug}}"
      summary: "{{filename}}"
      media_folder: "/src/assets/images/marquee"
      public_folder: "/assets/images/marquee"
      editor:
        preview: false
      fields:
          - { # Photo
                label: "Photo (required)",
                name: "image",
                widget: "image",
                required: true,
                media_folder: "/src/assets/images/marquee",
                public_folder: "/assets/images/marquee",
                hint: "Upload a square photo. Landscape or portrait images will be cropped to a 1:1 ratio."
            }
          - { # Alt Text
                label: "Alt Text (required)",
                name: "alt",
                widget: "string",
                required: true,
                hint: "Describe the photo for accessibility and SEO. e.g. 'Vendor booth at the Coal Mine Spring Festival in Littleton, CO'"
            }
          - { # Tags (hidden)
                label: "Tags",
                name: "tags",
                widget: "hidden",
                default: ["marqueePhoto"]
            }
          - { # Filename (hidden — used as CMS list label)
                label: "Filename",
                name: "filename",
                widget: "hidden"
            }
