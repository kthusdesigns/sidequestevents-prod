<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Favicons-->
    <!-- https://realfavicongenerator.net/ -->
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg"/>
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-title" content="Starter Kit"/>
    <link rel="manifest" href="/assets/favicons/site.webmanifest"/>

    <title>Content Manager</title>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js"></script>

    <!-- Decap CMS preview pane script -->
    <!-- Edit this script to customize the preview pane for your blog posts.  -->
    <!-- Documentation: https://decapcms.org/docs/customization/ -->
    <script>
        var BlogPreview = createClass({
            render: function () {
                var data = this.props.entry.get("data").toJS();
                var title = data.title;
                var rawDate = data.date;
                var image = data.image;
                var date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                var formattedDate = "";
                if (date) {
                    formattedDate = Intl.DateTimeFormat("en-US", {
                        month: "long",
                        day: "numeric",
                        year: "numeric"
                    }).format(date);
                }

                var cover = this.props.getAsset(image);

                return h("div", { className: "blog" },
                    h("span", { className: "date" }, "Published On: ", h("strong", {}, formattedDate)),
                    h("h1", { className: "title" }, title),
                    h("img", { src: cover ? cover.toString() : "", className: "cover", alt: "Cover" }),
                    h("div", { className: "markdown" }, this.props.widgetFor("body"))
                );
            }
        });

        var EventPreview = createClass({
            render: function () {
                var data = this.props.entry.get("data").toJS();
                var title = data.title;
                var rawDate = data.date;
                var rawStart = data.startTime;
                var rawEnd = data.endTime;
                var location = data.location;
                var streetAddress = data.streetAddress;
                var city = data.city;
                var state = data.state;
                var zip = data.zip;
                var eventExtUrl = data.eventExtUrl;
                var googleFormEmbed = data.googleFormEmbed;
                var image = data.image;
                var type = data.type;

                var date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                var formattedDate = "";
                if (date && !isNaN(date)) {
                    var dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
                    var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
                    formattedDate = dayNames[date.getUTCDay()] + ", " + monthNames[date.getUTCMonth()] + " " + date.getUTCDate() + ", " + date.getUTCFullYear();
                }

                function formatTime(raw) {
                    if (!raw) return "";
                    var d = new Date(raw);
                    if (isNaN(d)) return raw;
                    var hours = d.getHours();
                    var mins = d.getMinutes();
                    var ampm = hours >= 12 ? "PM" : "AM";
                    hours = hours % 12 || 12;
                    return hours + ":" + mins.toString().padStart(2, "0") + " " + ampm;
                }

                var startFormatted = formatTime(rawStart);
                var endFormatted = formatTime(rawEnd);
                var cover = this.props.getAsset(image);
                var cityState = [city, state].filter(Boolean).join(", ");

                return h("div", { className: "preview" },
                    h("div", { className: "preview__hero" },
                        cityState ? h("span", { className: "pill event-type" }, (type ? type.toUpperCase() + " IN " : "IN ") + cityState) : null,
                        h("h1", { className: "article-title" }, title),

                        h("div", { className: "event-meta" },
                            h("div", { className: "event-meta__item" },
                                h("span", { className: "event-meta__label" }, "DATE/TIME"),
                                h("span", { className: "event-meta__value" },
                                    formattedDate,
                                    (startFormatted || endFormatted)
                                        ? h("span", {},
                                            h("br"),
                                            startFormatted,
                                            endFormatted ? " – " + endFormatted : ""
                                        )
                                        : null
                                )
                            ),
                            streetAddress
                                ? h("div", { className: "event-meta__item" },
                                    h("span", { className: "event-meta__label" }, "VENUE/ADDRESS"),
                                    location ? h("span", { className: "event-meta__value" }, location) : null,
                                    h("span", { className: "event-meta__value" },
                                        streetAddress,
                                        h("br"),
                                        [city, state].filter(Boolean).join(", ") + " " + zip
                                    )
                                )
                                : null
                        ),

                        (eventExtUrl || googleFormEmbed)
                            ? h("div", { className: "button-wrapper" },
                                eventExtUrl
                                    ? h("a", { className: "button primary", href: eventExtUrl, target: "_blank", rel: "noopener noreferrer" },
                                        h("span", { className: "button-tl" }),
                                        h("span", { className: "button-tr" }),
                                        "REGISTER ON EVENTBRITE",
                                        h("span", { className: "button-bl" }),
                                        h("span", { className: "button-br" })
                                    )
                                    : null,
                                googleFormEmbed
                                    ? h("a", { className: "button secondary", href: "#vendor-form" },
                                        h("span", { className: "button-tl" }),
                                        h("span", { className: "button-tr" }),
                                        "BECOME A VENDOR",
                                        h("span", { className: "button-bl" }),
                                        h("span", { className: "button-br" })
                                    )
                                    : null
                            )
                            : null,

                        image
                            ? h("div", { className: "image-wrapper" },
                                h("img", { src: cover ? cover.toString() : "", className: "cover", alt: title || "" })
                            )
                            : null
                    ),

                    h("div", { className: "preview__body" },
                        h("div", { className: "article-content markdown" }, this.props.widgetFor("body")),
                        h("div", { className: "button-wrapper" },
                            eventExtUrl
                                ? h("a", { className: "button primary", href: eventExtUrl, target: "_blank", rel: "noopener noreferrer" },
                                    h("span", { className: "button-tl" }),
                                    h("span", { className: "button-tr" }),
                                    "Register on Eventbrite",
                                    h("span", { className: "button-bl" }),
                                    h("span", { className: "button-br" })
                                )
                                : null,
                            h("a", { className: "button secondary", href: "/events/" },
                                h("span", { className: "button-tl" }),
                                h("span", { className: "button-tr" }),
                                "Go Back to All Events",
                                h("span", { className: "button-bl" }),
                                h("span", { className: "button-br" })
                            )
                        )
                    ),

                    googleFormEmbed
                        ? h("div", { className: "preview__vendors", id: "vendor-form" },
                            h("h2", {}, "Interested In Being a Vendor For This Event?"),
                            h("p", {}, "Fill out the form below to apply to become a vendor. We review applications on a rolling basis and will reach out with a decision."),
                            h("div", { ref: function(node) { if (node) node.innerHTML = googleFormEmbed || ""; } })
                        )
                        : null
                );
            }
        });

        var PrivateEventPackagePreview = createClass({
            render: function () {
                var data = this.props.entry.get("data").toJS();
                var title = data.title;
                var bestFor = data.bestFor;
                var guestCapacity = data.guestCapacity;
                var duration = data.duration;
                var startingPrice = data.startingPrice;
                var image = data.image;
                var type = data.type;

                var cover = this.props.getAsset(image);

                return h("div", { className: "preview" },
                    h("div", { className: "preview__hero" },
                        h("span", { className: "pill odd" }, (type ? type.toUpperCase() + " " : "") + "PACKAGE"),
                        h("h1", { className: "article-title" }, title),

                        h("div", { className: "event-meta" },
                            h("div", { className: "event-meta__item" },
                                h("span", { className: "event-meta__label" }, "GROUP SIZE & DURATION"),
                                h("span", { className: "event-meta__value" },
                                    guestCapacity + " • " + duration + " Hour" + (duration !== 1 ? "s" : "")
                                )
                            ),
                            bestFor
                                ? h("div", { className: "event-meta__item" },
                                    h("span", { className: "event-meta__label" }, "BEST FOR"),
                                    h("span", { className: "event-meta__value" }, bestFor)
                                )
                                : null,
                            h("div", { className: "event-meta__item" },
                                h("span", { className: "event-meta__label" }, "PRICING"),
                                h("span", { className: "event-meta__value" }, startingPrice || "Custom Quote")
                            )
                        ),

                        h("div", { className: "button-wrapper" },
                            h("a", { className: "button primary", href: "#package-inquiry" },
                                h("span", { className: "button-tl" }),
                                h("span", { className: "button-tr" }),
                                "INQUIRE ABOUT THIS PACKAGE",
                                h("span", { className: "button-bl" }),
                                h("span", { className: "button-br" })
                            )
                        ),

                        image
                            ? h("div", { className: "image-wrapper" },
                                h("img", { src: cover ? cover.toString() : "", className: "cover", alt: title || "" })
                            )
                            : null
                    ),

                    h("div", { className: "preview__body" },
                        h("div", { className: "article-content markdown" }, this.props.widgetFor("body")),
                        h("div", { className: "button-wrapper" },
                            h("a", { className: "button secondary", href: "/private-event-packages/" },
                                h("span", { className: "button-tl" }),
                                h("span", { className: "button-tr" }),
                                "Go Back to All Packages",
                                h("span", { className: "button-bl" }),
                                h("span", { className: "button-br" })
                            )
                        )
                    )
                );
            }
        });

        CMS.registerPreviewTemplate("news", BlogPreview);
        CMS.registerPreviewTemplate("events", EventPreview);
        CMS.registerPreviewTemplate("privateEventPackages", PrivateEventPackagePreview);
        CMS.registerPreviewStyle("/admin/decap-preview-styles.css");

    </script>
</body>

</html>
