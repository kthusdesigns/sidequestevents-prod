<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!--Favicons-->
    <!-- https://realfavicongenerator.net/ -->
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg"/>
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-title" content="Starter Kit"/>
    <link rel="manifest" href="/assets/favicons/site.webmanifest"/>

    <title>Content Manager</title>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js"></script>

    <!-- Decap CMS preview pane script -->
    <!-- Edit this script to customize the preview pane for your blog posts.  -->
    <!-- Documentation: https://decapcms.org/docs/customization/ -->
    <script type="text/babel">
        const BlogPreview = createClass({
            render: function () {
                // Get all the props from the collection
                const data = this.props.entry.get("data").toJS();
                const { title, author, date: rawDate, image } = data;
                const date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                let formattedDate = "";
                if (date) {
                    formattedDate = Intl.DateTimeFormat("en-US", {
                        month: "long",
                        day: "numeric",
                        year: "numeric"
                    }).format(date);
                }

                const cover = this.props.getAsset(image);

                // Create elements for the preview pane in JSX, to be processed by Babel
                return (
                    <div className="blog">
                        <span className="date">Published On: <strong>{formattedDate}</strong></span>
                        <h1 className="title">{title}</h1>

                        <img src={cover?.toString()} className="cover" alt="Cover" />

                        <div className="markdown">
                            {this.props.widgetFor("body")}
                        </div>
                    </div>
                );
            }
        });

        const EventPreview = createClass({
            render: function () {
                const data = this.props.entry.get("data").toJS();
                const {
                    title,
                    date: rawDate,
                    startTime: rawStart,
                    endTime: rawEnd,
                    location,
                    streetAddress,
                    city,
                    state,
                    zip,
                    eventExtUrl,
                    googleFormEmbed,
                    image
                } = data;

                const date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                let formattedDate = "";
                if (date && !isNaN(date)) {
                    const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
                    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
                    formattedDate = `${dayNames[date.getUTCDay()]}, ${monthNames[date.getUTCMonth()]} ${date.getUTCDate()}, ${date.getUTCFullYear()}`;
                }

                function formatTime(raw) {
                    if (!raw) return "";
                    const d = new Date(raw);
                    if (isNaN(d)) return raw;
                    let hours = d.getHours();
                    const mins = d.getMinutes();
                    const ampm = hours >= 12 ? "PM" : "AM";
                    hours = hours % 12 || 12;
                    return `${hours}:${mins.toString().padStart(2, "0")} ${ampm}`;
                }

                const startFormatted = formatTime(rawStart);
                const endFormatted = formatTime(rawEnd);
                const cover = this.props.getAsset(image);
                const cityState = [city, state].filter(Boolean).join(", ");

                return (
                    <div className="preview">
                        <div className="preview__hero">
                            {cityState && (
                                <span className="pill">{cityState} EVENT</span>
                            )}
                            <h1 className="article-title">{title}</h1>

                            <div className="event-meta">
                                <div className="event-meta__item">
                                    <span className="event-meta__label">DATE/TIME</span>
                                    <span className="event-meta__value">
                                        {formattedDate}
                                        {(startFormatted || endFormatted) && (
                                            <span><br />{startFormatted}{endFormatted ? ` – ${endFormatted}` : ""}</span>
                                        )}
                                    </span>
                                </div>
                                {streetAddress && (
                                    <div className="event-meta__item">
                                        <span className="event-meta__label">VENUE/ADDRESS</span>
                                        {location && <span className="event-meta__value">{location}</span>}
                                        <span className="event-meta__value">
                                            {streetAddress}<br />{[city, state].filter(Boolean).join(", ")} {zip}
                                        </span>
                                    </div>
                                )}
                            </div>

                            {(eventExtUrl || googleFormEmbed) && (
                                <div className="button-wrapper">
                                    {eventExtUrl && (
                                        <a className="button primary" href={eventExtUrl} target="_blank" rel="noopener noreferrer">
                                            <span className="button-tl"></span>
                                            <span className="button-tr"></span>
                                            REGISTER ON EVENTBRITE
                                            <span className="button-bl"></span>
                                            <span className="button-br"></span>
                                        </a>
                                    )}
                                    {googleFormEmbed && (
                                        <a className="button secondary" href="#vendor-form">
                                            <span className="button-tl"></span>
                                            <span className="button-tr"></span>
                                            BECOME A VENDOR
                                            <span className="button-bl"></span>
                                            <span className="button-br"></span>
                                        </a>
                                    )}
                                </div>
                            )}

                            {image && (
                                <div className="image-wrapper">
                                    <img src={cover ? cover.toString() : ""} className="cover" alt={title || ""} />
                                </div>
                            )}
                        </div>

                        <div className="preview__body">
                            <div className="article-content markdown">
                                {this.props.widgetFor("body")}
                            </div>
                            <div className="button-wrapper">
                                {eventExtUrl && (
                                    <a className="button primary" href={eventExtUrl} target="_blank" rel="noopener noreferrer">
                                        <span className="button-tl"></span>
                                        <span className="button-tr"></span>
                                        Register on Eventbrite
                                        <span className="button-bl"></span>
                                        <span className="button-br"></span>
                                    </a>
                                )}
                                <a className="button secondary" href="/events/">
                                    <span className="button-tl"></span>
                                    <span className="button-tr"></span>
                                    Go Back to All Events
                                    <span className="button-bl"></span>
                                    <span className="button-br"></span>
                                </a>
                            </div>
                        </div>

                        {googleFormEmbed && (
                            <div className="preview__vendors" id="vendor-form">
                                <h2>Interested In Being a Vendor For This Event?</h2>
                                <p>Fill out the form below to apply to become a vendor. We review applications on a rolling basis and will reach out with a decision.</p>
                                <div ref={function(node) { if (node) node.innerHTML = googleFormEmbed || ""; }} />
                            </div>
                        )}
                    </div>
                );
            }
        });

        const PrivateEventPackagePreview = createClass({
            render: function () {
                const data = this.props.entry.get("data").toJS();
                const {
                    title,
                    bestFor,
                    guestCapacity,
                    duration,
                    startingPrice,
                    image
                } = data;

                const cover = this.props.getAsset(image);

                return (
                    <div className="preview">
                        <div className="preview__hero">
                            <span className="pill">PRIVATE EVENT PACKAGE</span>
                            <h1 className="article-title">{title}</h1>

                            <div className="event-meta">
                                <div className="event-meta__item">
                                    <span className="event-meta__label">GROUP SIZE & DURATION</span>
                                    <span className="event-meta__value">
                                        {guestCapacity} &bull; {duration} Hour{duration !== 1 ? "s" : ""}
                                    </span>
                                </div>
                                {bestFor && (
                                    <div className="event-meta__item">
                                        <span className="event-meta__label">BEST FOR</span>
                                        <span className="event-meta__value">{bestFor}</span>
                                    </div>
                                )}
                                <div className="event-meta__item">
                                    <span className="event-meta__label">PRICING</span>
                                    <span className="event-meta__value">{startingPrice || "Custom Quote"}</span>
                                </div>
                            </div>

                            <div className="button-wrapper">
                                <a className="button primary" href="#package-inquiry">
                                    <span className="button-tl"></span>
                                    <span className="button-tr"></span>
                                    INQUIRE ABOUT THIS PACKAGE
                                    <span className="button-bl"></span>
                                    <span className="button-br"></span>
                                </a>
                            </div>

                            {image && (
                                <div className="image-wrapper">
                                    <img src={cover ? cover.toString() : ""} className="cover" alt={title || ""} />
                                </div>
                            )}
                        </div>

                        <div className="preview__body">
                            <div className="article-content markdown">
                                {this.props.widgetFor("body")}
                            </div>
                            <div className="button-wrapper">
                                <a className="button secondary" href="/private-event-packages/">
                                    <span className="button-tl"></span>
                                    <span className="button-tr"></span>
                                    Go Back to All Packages
                                    <span className="button-bl"></span>
                                    <span className="button-br"></span>
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }
        });

        // Register the elements and styles for the "blog" collection
        CMS.registerPreviewTemplate("news", BlogPreview);
        CMS.registerPreviewTemplate("events", EventPreview);
        CMS.registerPreviewTemplate("privateEventPackages", PrivateEventPackagePreview);
        CMS.registerPreviewStyle("/admin/decap-preview-styles.css");

    </script>
</body>

</html>
