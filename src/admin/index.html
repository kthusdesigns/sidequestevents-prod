<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!--Favicons-->
    <!-- https://realfavicongenerator.net/ -->
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg"/>
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-title" content="Starter Kit"/>
    <link rel="manifest" href="/assets/favicons/site.webmanifest"/>

    <title>Content Manager</title>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js"></script>

    <!-- Decap CMS preview pane script -->
    <!-- Edit this script to customize the preview pane for your blog posts.  -->
    <!-- Documentation: https://decapcms.org/docs/customization/ -->
    <script type="text/babel">
        const BlogPreview = createClass({
            render: function () {
                // Get all the props from the collection
                const data = this.props.entry.get("data").toJS();
                const { title, author, date: rawDate, image } = data;
                const date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                let formattedDate = "";
                if (date) {
                    formattedDate = Intl.DateTimeFormat("en-US", {
                        month: "long",
                        day: "numeric",
                        year: "numeric"
                    }).format(date);
                }

                const cover = this.props.getAsset(image);

                // Create elements for the preview pane in JSX, to be processed by Babel
                return (
                    <div className="blog">
                        <span className="date">Published On: <strong>{formattedDate}</strong></span>
                        <h1 className="title">{title}</h1>

                        <img src={cover?.toString()} className="cover" alt="Cover" />

                        <div className="markdown">
                            {this.props.widgetFor("body")}
                        </div>
                    </div>
                );
            }
        });

        const EventPreview = createClass({
            render: function () {
                const data = this.props.entry.get("data").toJS();
                const { title, date: rawDate, timeRange, location, address, eventbriteUrl, image } = data;
                const date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                let formattedDate = "";
                if (date) {
                    const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
                    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
                    formattedDate = `${dayNames[date.getUTCDay()]}, ${monthNames[date.getUTCMonth()]} ${date.getUTCDate()}, ${date.getUTCFullYear()}`;
                }

                const cover = this.props.getAsset(image);

                return (
                    <div className="blog">
                        <h1 className="title">{title}</h1>

                        <div className="event-meta">
                            <div className="event-meta__item">
                                <span className="event-meta__label">Date</span>
                                <span className="event-meta__value">{formattedDate}{timeRange ? <span> &nbsp;&nbsp;•&nbsp;&nbsp; {timeRange}</span> : null}</span>
                            </div>
                            {location && (
                                <div className="event-meta__item">
                                    <span className="event-meta__label">Venue</span>
                                    <span className="event-meta__value">{location}</span>
                                </div>
                            )}
                            {address && (
                                <div className="event-meta__item">
                                    <span className="event-meta__label">Address</span>
                                    <span className="event-meta__value">{address}</span>
                                </div>
                            )}
                        </div>

                        {eventbriteUrl && (
                            <div>
                                <a className="eventbrite-btn" href={eventbriteUrl} target="_blank" rel="noopener noreferrer">Register on Eventbrite</a>
                            </div>
                        )}

                        <img src={cover?.toString()} className="cover" alt={title} />

                        <div className="markdown">
                            {this.props.widgetFor("body")}
                        </div>
                    </div>
                );
            }
        });

        // Register the elements and styles for the "blog" collection
        CMS.registerPreviewTemplate("news", BlogPreview);
        CMS.registerPreviewTemplate("events", EventPreview);
        CMS.registerPreviewStyle("/admin/decap-preview-styles.css");

        // Video — Google Drive share URL → embeddable iframe
        CMS.registerEditorComponent({
            id: "video",
            label: "Video (Google Drive)",
            fields: [{
                name: "url",
                label: "Google Drive Share URL",
                widget: "string",
                hint: "Paste the Google Drive share link for the video (e.g. https://drive.google.com/file/d/.../view?usp=sharing)"
            }],
            pattern: /^<iframe src="https:\/\/drive\.google\.com\/file\/d\/([^/]+)\/preview" width="100%" height="480" allow="autoplay" allowfullscreen><\/iframe>$/,
            fromBlock: function(match) {
                return { url: "https://drive.google.com/file/d/" + match[1] + "/view?usp=sharing" };
            },
            toBlock: function(obj) {
                var match = obj.url.match(/\/file\/d\/([^/]+)/);
                var id = match ? match[1] : obj.url;
                return '<iframe src="https://drive.google.com/file/d/' + id + '/preview" width="100%" height="480" allow="autoplay" allowfullscreen></iframe>';
            },
            toPreview: function(obj) {
                var match = obj.url.match(/\/file\/d\/([^/]+)/);
                var id = match ? match[1] : obj.url;
                return '<iframe src="https://drive.google.com/file/d/' + id + '/preview" width="100%" height="480" allow="autoplay" allowfullscreen></iframe>';
            }
        });

        // PDF (Upload) — file picker → embedded iframe
        CMS.registerEditorComponent({
            id: "pdf-upload",
            label: "PDF (File Upload)",
            fields: [{
                name: "src",
                label: "PDF File",
                widget: "file",
                media_folder: "/src/assets/pdfs",
                public_folder: "/assets/pdfs",
                hint: "Upload a PDF from your computer."
            }],
            pattern: /^<iframe src="([^"]+\.pdf)" width="100%" height="800px" title="Attached document"><\/iframe>$/,
            fromBlock: function(match) {
                return { src: match[1] };
            },
            toBlock: function(obj) {
                return '<iframe src="' + obj.src + '" width="100%" height="800px" title="Attached document"></iframe>';
            },
            toPreview: function(obj) {
                return '<iframe src="' + obj.src + '" width="100%" height="800px" title="Attached document"></iframe>';
            }
        });

        // PDF (Google Drive) — share URL → embedded iframe
        CMS.registerEditorComponent({
            id: "pdf-google-drive",
            label: "PDF (Google Drive)",
            fields: [{
                name: "url",
                label: "Google Drive Share URL",
                widget: "string",
                hint: "Paste the Google Drive share link for the PDF (e.g. https://drive.google.com/file/d/.../view?usp=sharing)"
            }],
            pattern: /^<iframe src="https:\/\/drive\.google\.com\/file\/d\/([^/]+)\/preview\?rm=minimal" width="100%" height="800px" title="Attached document" allowfullscreen><\/iframe>$/,
            fromBlock: function(match) {
                return { url: "https://drive.google.com/file/d/" + match[1] + "/view?usp=sharing" };
            },
            toBlock: function(obj) {
                var match = obj.url.match(/\/file\/d\/([^/]+)/);
                var id = match ? match[1] : obj.url;
                return '<iframe src="https://drive.google.com/file/d/' + id + '/preview?rm=minimal" width="100%" height="800px" title="Attached document" allowfullscreen></iframe>';
            },
            toPreview: function(obj) {
                var match = obj.url.match(/\/file\/d\/([^/]+)/);
                var id = match ? match[1] : obj.url;
                return '<iframe src="https://drive.google.com/file/d/' + id + '/preview?rm=minimal" width="100%" height="800px" title="Attached document" allowfullscreen></iframe>';
            }
        });
    </script>
</body>

</html>
