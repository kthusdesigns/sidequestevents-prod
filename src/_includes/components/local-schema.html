<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "LocalBusiness",
            "@id": "{{ client.domain }}/#organization",
            "name": "{{ client.name }}",
            "description": "{{ description | escape }}",
            "url": "{{ client.domain }}",
            {% if client.email %}"email": "{{ client.email }}",{% endif %}
            {% if client.address %}
            "address": {
                "@type": "PostalAddress",
                "streetAddress": "{{ client.address.lineOne }}{% if client.address.lineTwo %}, {{ client.address.lineTwo }}{% endif %}",
                "addressLocality": "{{ client.address.city }}",
                "addressRegion": "{{ client.address.state }}",
                "postalCode": "{{ client.address.zip }}",
                "addressCountry": "{{ client.address.country }}"
            },
            {% endif %}
            "areaServed": {
                "@type": "City",
                "name": "Denver",
                "addressRegion": "CO",
                "addressCountry": "US"
            },
            "sameAs": [
                {%- for platform, url in client.socials %}
                    {% if not loop.first %},{% endif %}"{{ url }}"
                {%- endfor %}
            ],
            "mainEntityOfPage": "{{ client.domain }}{{ page.url }}"
        }
    ]
}
</script>
